  const toISO=v=>{ if(typeof v==='number' && v>30000 && v<80000){ const t=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5), y=t.getUTCFullYear(), a=t.getUTCMonth()+1, b=t.getUTCDate(); return b<=12 ? iso3(y, b, a) : iso3(y, a, b); } const s=String(v||'').trim(); const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m?iso3(+m[3],+m[2],+m[1]):null; };
  const num=v=>typeof v==='number'?v:(+(String(v||'').replace(/[^0-9.\-]/g,''))||0);
  let date=null, opening=null, openingDate=null; const tx=[];
  for(let r=hr+1;r<A.length;r++){ const row=A[r]||[]; const dv=row[cD];
    if(dv && /CLOSE|BALANCE/i.test(String(dv))) continue;
    const d=toISO(dv); if(d) date=d;
    const item=String(row[cI]||'').trim(), ain=num(row[cIn]), aout=num(row[cOut]);
    if(!item && !ain && !aout){ if(opening===null && typeof row[cB]==='number'){ opening=row[cB]; openingDate=date; } continue; }
    if(!date) continue;
    const [cat,...rest]=item.split('\n').map(x=>x.trim()).filter(Boolean);
    tx.push({date, cat:rest.length?cat:(cat||''), item:rest.join(' '), in:ain, out:aout, notes:String(row[cN]||'').trim()});
  }
  if(!tx.length){ toast('Tiada transaksi dijumpai.'); return; }
  const sIn=tx.reduce((s,t)=>s+t.in,0), sOut=tx.reduce((s,t)=>s+t.out,0), endBal=r2((opening||0)+sIn-sOut);
  openModal('Import Excel Lama', `<p style="margin:0">Sheet <b translate="no">${esc(name)}</b>: <b>${tx.length} transaksi</b> dari ${esc(dmyS(tx[0].date))} hingga ${esc(dmyS(tx[tx.length-1].date))}.</p>
    <p style="margin:0">Baki awal <b>${fmtRM(opening||0)}</b> · Masuk <b>${fmtRM(sIn)}</b> · Keluar <b>${fmtRM(sOut)}</b> · Baki akhir <b>${fmtRM(endBal)}</b></p>
    ${finTx.length?`<p class="hint" style="margin:0;color:var(--c-rev)">Sudah ada ${finTx.length} transaksi dalam app. Import ini akan menambah, bukan menggantikan.</p>`:''}<div class="err" id="oiErr"></div>`,
    `<button class="btn ghost" data-act="close">Batal</button><button class="btn primary" id="oiGo">Import ${tx.length} transaksi</button>`);
  $('oiGo').onclick=async()=>{ const b=$('oiGo'); b.disabled=true; try{ const now=Date.now(); let i=0;
      if(!finTx.length && opening!==null) await db.collection('fin_settings').doc('ledger').set({...finLed, opening:r2(opening), openingDate:openingDate||tx[0].date, updatedAt:now});
      const num=pvNumberer(); for(const t of tx){ b.textContent=`Menyimpan ${++i}/${tx.length}…`; const tref=db.collection('fin_tx').doc(); const td={...t, src:'excel', seq:now+i, createdAt:now, updatedAt:now}; await tref.set(td); if(isPayOut(td)) await ensurePV({...td, id:tref.id}, num); }
      closeModal(); toast(`${tx.length} transaksi diimport`); }catch(err){ b.disabled=false; $('oiErr').textContent=writeErr(err); } };
}
function exportLedger(){
  if(!window.XLSX){ toast('Excel belum dimuatkan.'); return; }
  const rows=ledgerRows(), open=r2(finLed.opening||0), A=[['escMedia Account'],[+todayISO().slice(0,4)],['DATE','ITEM','AMOUNT IN (RM)','AMOUNT OUT (RM)','BALANCE (RM)','NOTES'],[finLed.openingDate?dmyS(finLed.openingDate):'','','','',open,'']];
  const merges=[{s:{r:0,c:0},e:{r:0,c:5}},{s:{r:1,c:0},e:{r:1,c:5}}], closes=[];
  let prev=open, last='';
  const ms=new Map(); rows.forEach(r=>{ const k=r.date.slice(0,7); if(!ms.has(k)) ms.set(k,[]); ms.get(k).push(r); });
  for(const [k,l] of ms){ l.forEach(r=>{ A.push([r.date!==last?dmyS(r.date):'', [r.cat,r.item].filter(Boolean).join('\n'), +r.in||'-', +r.out||'-', r.bal, r.notes||'']); last=r.date; });
    const end=l[l.length-1].bal; A.push([`${MONTH_UP[+k.slice(5)-1]} CLOSE`,'','','',end,`Net RM ${fmtNum(end-prev)}`]); closes.push(A.length-1); merges.push({s:{r:A.length-1,c:0},e:{r:A.length-1,c:3}}); prev=end; }
  const ws=XLSX.utils.aoa_to_sheet(A); ws['!merges']=merges; ws['!cols']=[{wch:12},{wch:34},{wch:16},{wch:17},{wch:15},{wch:40}];
  const border={top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}};
  for(let r=0;r<A.length;r++) for(let c=0;c<6;c++){ const ref=XLSX.utils.encode_cell({r,c}); if(!ws[ref]) ws[ref]={t:'s',v:''};
    const s={font:{name:'Arial',sz:10},border,alignment:{vertical:'center',wrapText:true,horizontal:c>=2&&c<=4?'right':c===0?'center':'left'}};
    if(r<3){ s.font.bold=true; s.alignment.horizontal='center'; s.fill={fgColor:{rgb:r===2?'D9D9D9':'C9DAF8'}}; }
    if(closes.includes(r)){ s.font.bold=true; s.fill={fgColor:{rgb:'FFFF00'}}; }
    if(typeof ws[ref].v==='number' && c>=2 && c<=4) ws[ref].z='#,##0.00';
    ws[ref].s=s; }
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'RECEIVE AND SPENT'); saveWb(wb, `escMedia Account - Receive and Spent ${todayISO()}.xlsx`);
}
