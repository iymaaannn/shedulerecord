.sheet.wide{max-width:780px}
.arlist{display:flex;flex-direction:column;gap:18px}
.ayear-h{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.ayear-h h4{margin:0;font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.ayear-h .meta,.atype-h .meta{color:var(--muted);font-size:13px}
.atype{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.atype-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.atype-h .btn{margin-left:auto}
.aitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.aitem:last-child{border-bottom:0}
.aname{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.aname strong{overflow-wrap:anywhere}
.aname small{color:var(--muted);font-size:12px}
.aact{display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:5px 10px;font-size:12.5px}
.notice .btn{margin-left:8px;padding:4px 10px;font-size:12.5px}
.notice{background:var(--run-bg);color:var(--run);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langsw button{padding:3px 9px;font-size:11px;letter-spacing:.06em}

/* ===== escMedia theme: monochrome, Poppins ===== */
body{font-family:var(--f-body);font-size:14px;letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
.mono,.vitem,.vam,.vpg,.vss,.room,.daytag,.typetag,.tag2,.metaline .tag,.edtag{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.wrap{gap:20px}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:inline-grid;place-items:center;font-weight:700;font-size:17px;line-height:1;letter-spacing:-.04em;flex:none}
.wordmark{font-weight:400;font-size:17px;letter-spacing:-.02em;line-height:1}
.wordmark b{font-weight:700}
.bm-div{width:1px;height:18px;background:var(--line2)}
.product{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.appbar-r{display:flex;align-items:center;gap:10px}
.modepill{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 11px;white-space:nowrap}
.top{align-items:flex-end}
h1{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em;font-size:clamp(26px,4.4vw,40px);line-height:1.05}
.brand{gap:8px}
.typetag{border-radius:99px;padding:3px 10px;font-size:10.5px;font-weight:600;letter-spacing:.14em;border-color:var(--line2);color:var(--ink)}
.btn{border-radius:10px;font-weight:500;padding:9px 14px;border-color:var(--line);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.primary:hover{filter:none;opacity:.88}
.btn.danger{color:var(--c-rev);border-color:var(--line2)}
.btn.danger:hover{border-color:var(--c-rev)}
.btn.danger.solid{background:var(--c-rev);color:#fff;border-color:var(--c-rev)}
select.sel,.f input,.f select,.f textarea,.search{border-radius:10px}
.seg{border-radius:10px}
.seg button{font-weight:500}
.langsw{border-radius:99px}
.langsw button{padding:4px 11px;font-size:11px;font-weight:600;letter-spacing:.08em}
.strip{border-radius:16px;padding:20px;border-color:var(--line)}
.stat b{font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:-.03em;color:var(--ink)}
.stat.ok b{color:var(--c-ok)} .stat.run b{color:var(--c-run)}
.stat span{font-size:10.5px;letter-spacing:.12em;font-weight:500;display:flex;align-items:center;gap:6px}
.stat span::before{content:"";width:8px;height:8px;border-radius:2px;flex:none;background:var(--idle-bg);border:1px solid var(--line2)}
.stat:first-child span::before{display:none}
.stat span::before{border:0;border-radius:99px}
.stat.ok span::before{background:var(--c-ok)}
.stat.run span::before{background:var(--c-run)}
.stat.rev span::before{background:var(--c-idle)}
.bar{height:8px;background:var(--idle-bg)}
.bar .ok{background:var(--c-ok)} .bar .sent{background:var(--c-sent)} .bar .run{background:var(--c-run)} .bar .rev{background:var(--c-rev)}
.prog-row a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:500}
#sPct{font-family:var(--f-display);font-weight:600}
.chip{border-radius:99px;font-weight:500;letter-spacing:0;padding:0 14px;height:38px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip .mono{font-size:12px;opacity:.6;font-weight:500}
.chip[aria-pressed="true"] .mono{opacity:.75}
.tools .search,.tools select.sel,.tools .btn{height:38px;font-size:13.5px}
.tools select.sel{padding:0 12px}
.tools .search input{font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.track{border-radius:16px}
.track-h{background:var(--surface);padding:14px 16px}
.track-h .mini .bar .ok{background:var(--c-ok)}
.daytag{background:var(--ink);color:var(--bg);border-radius:8px;font-weight:600;letter-spacing:.06em;padding:5px 10px}
.track-h h2{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em}
.row.head,.vrow.head,.srow.head{background:var(--surface2);font-size:10.5px;letter-spacing:.08em;font-weight:500;white-space:nowrap}
.row.head>span,.vrow.head>span,.srow.head>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.sel,.vrow.sel,.srow.sel{background:var(--accent-soft)}
.name,.vitem{font-weight:600}
.lnk{color:var(--ink);border-radius:8px;font-weight:500;border-color:var(--line2)}
.lnk:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.edtag{border-radius:99px;font-weight:500;padding:2px 9px}
/* status pills: tinted, colour-coded */
.pill{border-radius:99px;font-weight:600;letter-spacing:.04em;font-size:11px;border:0;padding-left:22px;position:relative}
select.pill{background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%,10px 50%;background-size:4px 4px,4px 4px,6px 6px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%),radial-gradient(circle,currentColor 0 2.6px,transparent 3px)}
span.pill{padding:5px 12px 5px 22px;background-image:radial-gradient(circle,currentColor 0 2.6px,transparent 3px);background-repeat:no-repeat;background-size:6px 6px;background-position:10px 50%}
.s-ok{background-color:var(--c-ok-bg);color:var(--c-ok)}
.s-sent{background-color:var(--c-sent-bg);color:var(--c-sent)}
.s-run{background-color:var(--c-run-bg);color:var(--c-run)}
.s-rev{background-color:var(--c-rev-bg);color:var(--c-rev)}
.s-idle{background-color:var(--c-idle-bg);color:var(--c-idle)}
.s-todo{background-color:var(--c-todo-bg);color:var(--c-todo)}
.chip.st{border-color:transparent}
.chip.st .mono{opacity:.75}
.chip.st.s-ok[aria-pressed="true"]{background:var(--c-ok);border-color:var(--c-ok);color:var(--bg)}
.chip.st.s-run[aria-pressed="true"]{background:var(--c-run);border-color:var(--c-run);color:var(--bg)}
.chip.st.s-rev[aria-pressed="true"]{background:var(--c-rev);border-color:var(--c-rev);color:var(--bg)}
.chip.st.s-idle[aria-pressed="true"]{background:var(--c-idle);border-color:var(--c-idle);color:var(--bg)}
.chip.st.s-sent[aria-pressed="true"]{background:var(--c-sent);border-color:var(--c-sent);color:var(--bg)}
.chip.st.s-todo[aria-pressed="true"]{background:var(--c-todo);border-color:var(--c-todo);color:var(--bg)}
.chip.st.s-off[aria-pressed="true"]{background:var(--c-off);border-color:var(--c-off);color:var(--bg)}
.chip.st.s-pp[aria-pressed="true"]{background:var(--c-pp);border-color:var(--c-pp);color:var(--bg)}
.chip.st[aria-pressed="true"] .mono{opacity:.85}
.pill option{background:var(--surface);color:var(--ink)}
.tag{border-radius:99px;font-weight:600;padding:2px 9px;letter-spacing:.05em}
.t-off{background:var(--c-off-bg);color:var(--c-off)}
.t-on{background:var(--c-ok-bg);color:var(--c-ok)}
.t-pp{background:var(--c-pp-bg);color:var(--c-pp)}
.vrow.is-pp,.srow.is-pp{box-shadow:inset 3px 0 0 var(--c-pp)}
.cancelbar{background:var(--c-rev-bg);color:var(--c-rev);border-radius:12px;font-weight:600;letter-spacing:.14em}
.notice{background:var(--c-run-bg);color:var(--ink);border:1px solid transparent;border-left:3px solid var(--c-run);border-radius:10px}
.empty{border-radius:16px;border-color:var(--line2)}
.empty h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em}
.sheet{border-radius:18px}
.sheet header h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em}
.sheet footer{border-radius:0 0 18px 18px}
.f label{font-size:10.5px;font-weight:500;letter-spacing:.1em}
.f label.radio{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1.35;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.f label.radio:hover{border-color:var(--line2)}
.f label.radio:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.f label.radio:has(input:disabled){opacity:.45;cursor:not-allowed}
.f label.radio>span{flex:1;min-width:0}
.f .radio input[type=radio]{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;min-width:0;padding:0;margin:0;border:1.5px solid var(--line2);border-radius:50%;background:var(--surface);box-shadow:none;cursor:inherit}
.f .radio input[type=radio]:checked{border-color:var(--ink);background:radial-gradient(circle,var(--ink) 0 4px,transparent 4.5px)}
.f .radio input[type=radio]:focus-visible{box-shadow:0 0 0 3px var(--accent-soft)}
.f .radio .rcount{flex:none;min-width:26px;text-align:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.f .radio:has(input:checked) .rcount{background:var(--ink);color:var(--bg)}
.f .radio input[type=checkbox]{flex:none;width:16px;height:16px;padding:0;margin:0}
.ropts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.ropts{grid-template-columns:1fr}}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.err,.confirm{color:var(--c-rev);font-weight:500}
.toast{background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 18px}
.bulk{background:var(--ink);color:var(--bg);border-radius:14px}
.bulk .btn{border-radius:99px}
.vdur{font-family:var(--f-body);font-weight:500;font-size:12.5px;letter-spacing:.02em}
.appfoot{margin-top:8px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.appfoot b{color:var(--ink);font-weight:600}
input[type=checkbox]{accent-color:var(--ink)}
:focus-visible{outline-color:var(--ink)}
body.dropping .wrap::after{border-color:var(--ink);color:var(--ink);background:color-mix(in srgb,var(--surface) 92%,transparent);font-family:var(--f-display)}
@media (max-width:520px){.product,.bm-div{display:none}.modepill{display:none}}

/* ===== app shell (rail, home grid, activity, search) ===== */
body{padding-left:68px}
.rail{position:fixed;left:0;top:0;bottom:0;width:68px;z-index:15;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 16px;background:var(--surface);border-right:1px solid var(--line)}
.rail-logo{border:0;background:none;padding:0;margin-bottom:12px}
.rail-logo .logo{width:36px;height:36px;border-radius:10px;font-size:20px}
.rbtn{position:relative;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center;transition:background .15s,color .15s}
.rbtn svg{width:21px;height:21px}
.rbtn:hover{background:var(--surface2);color:var(--ink)}
.rbtn[aria-current="true"]{background:var(--ink);color:var(--bg)}
.rdot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--c-rev);box-shadow:0 0 0 2px var(--surface)}
.rspace{flex:1}
.ravatar{width:38px;height:38px;border-radius:50%;padding:0;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line2);overflow:hidden;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--uc,linear-gradient(135deg,#FF7A3D,#FF4D6D));cursor:pointer}
.ravatar:hover,.ravatar[aria-expanded="true"]{box-shadow:0 0 0 2px var(--ink)}
.ravatar img,.uav img{width:100%;height:100%;object-fit:cover;display:block}
.uav{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--uc,linear-gradient(135deg,#FF7A3D,#FF4D6D))}
.upop{position:fixed;left:78px;bottom:16px;z-index:30;width:270px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.uhead{display:flex;gap:12px;align-items:center;min-width:0}
.uid{display:flex;flex-direction:column;min-width:0}
.uid b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uid small{font-size:12px;color:var(--muted)}
.usec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.ulab{font-size:12px;color:var(--muted);font-weight:500}
.usec .seg button{padding:5px 12px;font-size:12.5px}
.ufoot{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.ufoot .logo{display:inline-grid;width:20px;height:20px;border-radius:6px;font-size:11px}
.ufoot b{color:var(--ink)}
.ubtn{justify-content:center;width:100%}
.ubtn svg{width:16px;height:16px}
.adm-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.adm-row:last-child{border-bottom:0}
.adm-row span{flex:1;min-width:0;overflow-wrap:anywhere}
.adm-row small{color:var(--muted)}
.brandmark .logo{display:none}
.solo .rail{display:none} body.solo{padding-left:0} .solo .brandmark .logo{display:inline-grid}
#projview{display:flex;flex-direction:column;gap:20px}
#projview[hidden]{display:none}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.4;color:var(--muted);margin-bottom:-6px}
.top .brand{gap:10px}
.top h1{line-height:1.1;padding-top:2px}
.tools{row-gap:10px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--ink)}
.crumb #crumbName{color:var(--ink);font-weight:500}
.solo .crumb{display:none}
/* home */
.home{display:flex;flex-direction:column;gap:20px}
.hhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hhead h1{margin:0}
.hsub{margin:4px 0 0;color:var(--muted);font-size:13px}
.htools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.htools .seg button{padding:7px 12px;font-size:13px}
#hView button{padding:7px 9px;display:grid;place-items:center}
#hView svg{width:16px;height:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s;color:inherit;font:inherit}
.pcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.14);border-color:var(--line2)}
.pcov{position:relative;aspect-ratio:16/11;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:radial-gradient(120% 90% at 15% 0%,var(--g1) 0%,transparent 62%),radial-gradient(90% 80% at 100% 100%,var(--g3) 0%,transparent 70%),linear-gradient(140deg,var(--g2),var(--g3))}
.pcov::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.42));pointer-events:none}
.pcov>*{position:relative;z-index:1}
.pctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pctype{font-size:10px;font-weight:600;letter-spacing:.14em;background:rgba(0,0,0,.28);backdrop-filter:blur(6px);border-radius:99px;padding:3px 9px}
.pcpct{font-size:11px;font-weight:600;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);border-radius:99px;padding:3px 9px}
.pctitle strong{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25;overflow-wrap:anywhere;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.pctitle small{display:block;font-size:11.5px;opacity:.85;margin-top:2px}
.team-list{display:flex;flex-direction:column;gap:8px}
.team-row{display:grid;grid-template-columns:170px minmax(0,1fr) 40px;gap:8px;align-items:center}
.team-row .btn{padding:0;justify-content:center;height:40px}
.team-add{align-self:flex-start}
.team-empty{font-size:12.5px;color:var(--muted);padding:2px 0}
.gone{display:none!important}
.btn .chev{width:14px;height:14px;margin-left:2px;margin-right:-2px;opacity:.7;transition:transform .15s}
.btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dmenu{position:absolute;z-index:60;min-width:250px;max-width:calc(100vw - 16px);padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 14px 40px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:2px;animation:dmIn .12s ease-out}
@keyframes dmIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dmenu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer}
.dmenu button:hover,.dmenu button:focus-visible{background:var(--surface2);outline:none}
.dmenu .mi-ico{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.dmenu .mi-ico svg{width:16px;height:16px}
.dmenu .mi-tx{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.dmenu .mi-tx b{font-size:13.5px;font-weight:600}
.dmenu .mi-tx small{font-size:11.5px;color:var(--muted)}
.dmenu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
@media (min-width:821px){.evtrack .vrow{grid-template-columns:28px minmax(170px,1.4fr) 140px 72px minmax(0,.6fr) 92px minmax(0,1.6fr) 36px}}
@media (min-width:821px){.row.bo{grid-template-columns:28px 44px minmax(0,1fr) 140px 120px 120px 36px}}
.rteam{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rteam .tchip{padding:2px 8px 2px 3px;font-size:11px}
.rteam .tchip i{width:16px;height:16px;font-size:8.5px}
.name small.evl{font-weight:500}
/* Title Case for labels, titles, buttons and menus */
#strip .stat .lab,.hs-card .lab,#strip .prog-tx strong,#mTitle,.btn,.dmenu .mi-tx b,.seg button,select.sel,.track-h .meta,.mlink span,.sbadge,.subtabs b,.crumb a,.empty h3,.dhead h3,.sday-h .meta,.lnk,.chip,.hs-pill,#uRole,.track-h .mini .mono{text-transform:capitalize}
/* liquid glass */
.gl-bg{position:absolute;inset:0;overflow:hidden;z-index:0;background:radial-gradient(120% 140% at 0% 0%,var(--g1,#7C5CFF) 0%,transparent 55%),radial-gradient(120% 140% at 100% 100%,var(--g3,#FF8A3D) 0%,transparent 60%),linear-gradient(135deg,#17131F,#0E0D12)}
.gl-bg i{position:absolute;border-radius:50%;filter:blur(42px);opacity:.75;mix-blend-mode:screen;animation:glDrift 18s ease-in-out infinite alternate}
.gl-bg i:nth-child(1){width:46%;aspect-ratio:1;left:-8%;top:-30%;background:var(--g1,#7C5CFF)}

window.ESC = { user:null, isAdmin:false, isOwner:false, fs:null, admins:[] };
(function(){
  const fileSaver = { save: async ({filename, data}) => {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  } };
  if(!window.firebase){ window.claude = { use: async n => n==='downloads' ? fileSaver : null }; return; }
  firebase.initializeApp(FB_CONFIG);
  const auth = firebase.auth(), fs = firebase.firestore();
  try{ fs.settings({ ignoreUndefinedProperties: true }); }catch{}
  ESC.fs = fs;
  const lower = e => String(e||'').trim().toLowerCase();
  async function adminList(){
    try{ const d = await fs.doc('config/admins').get(); return (d.exists && d.data().emails || []).map(lower); }catch{ return []; }
  }
  const ready = new Promise(resolve => {
    let first = true;
    auth.onAuthStateChanged(async u => {
      if(!first){ location.reload(); return; }
      first = false;
      ESC.user = u;
      const em = lower(u && u.email);
      ESC.isOwner = !!u && em === OWNER_EMAIL;
      ESC.admins = u ? await adminList() : [];
      ESC.isAdmin = ESC.isOwner || (!!u && ESC.admins.includes(em));
      resolve();
    });
  });
  ESC.signIn = () => {
    const prov = new firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({ prompt: 'select_account' });
    return auth.signInWithPopup(prov).catch(e => {
      if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)) return auth.signInWithRedirect(prov);
      if(e.code !== 'auth/popup-closed-by-user') alert('Log masuk gagal: ' + (e.message || e.code));
    });
  };
  ESC.signOut = () => auth.signOut();
  ESC.saveAdmins = list => fs.doc('config/admins').set({ emails: [...new Set(list.map(lower).filter(Boolean))], updatedAt: Date.now() });
  const db = { collection: path => fs.collection(path) };
  window.claude = { use: async name => {
    await ready;
    if(name === 'db') return db;
    if(name === 'downloads') return fileSaver;
    if(name === 'user'){
      const u = ESC.user;
      const me = { id: u ? u.uid : null, name: (u && (u.displayName || u.email)) || '', avatarUrl: (u && u.photoURL) || '', color: '#E8590C', email: u ? u.email : null, isOwner: ESC.isOwner, canEdit: ESC.isAdmin };
      return { canEdit: async () => ESC.isAdmin, isOwner: async () => ESC.isOwner, me: async () => me };
    }
    return null;
  } };
})();

  const t={text:[]}; const rx=/(\w+):"([^"]+)"|(\w+):(\S+)|"([^"]+)"|(\S+)/g; let m;
  while((m=rx.exec(q))){ const k=(m[1]||m[3]||'').toLowerCase(), v=(m[2]||m[4]||m[5]||m[6]||'');
    if(k==='status') t.status=v.toUpperCase(); else if(k==='editor') t.editor=v.toUpperCase(); else if(k==='hari'||k==='days') t.days=+v||7;
    else if(k==='ada'||k==='has') t.has=v.toLowerCase(); else if(k==='lokasi'||k==='location') t.loc=v.toUpperCase(); else if(k==='projek'||k==='project') t.proj=v.toUpperCase();
    else if(k) t.text.push((k+':'+v).toLowerCase()); else t.text.push(v.toLowerCase()); }
  return t;
}
function searchHits(q){
  const t=parseQ(q), out=[];
  for(const p of visibleProjects()){
    if(t.proj && !String(p.name).toUpperCase().includes(t.proj)) continue;
    for(const e of (allEnt[p.id]||[])){
      if(t.status && String(e.status||'').toUpperCase()!==t.status) continue;
      if(t.editor && normEd(e.editor)!==t.editor) continue;
      if(t.days && !(e.updatedAt && Date.now()-e.updatedAt<=t.days*864e5)) continue;
      if(t.has && /kom|com|not/.test(t.has) && !String(e.notes||e.feedback||'').trim()) continue;
      if(t.loc && !String(e.location||'').toUpperCase().includes(t.loc)) continue;
      const hay=[e.name,e.item,e.scene,e.notes,e.feedback,e.location,e.editor,e.room,e.status,e.sceneStatus,e.duration,p.name].join(' ').toLowerCase();
      if(t.text.some(w=>!hay.includes(w))) continue;
      out.push({p,e});
    }
  }
  return {t,out};
}
function renderSearch(){
  const q=$('gq').value.trim(), body=$('sBody');
  if(!q){
    const all=visibleProjects().flatMap(p=>allEnt[p.id]||[]);
    const ed=editorsOf(all)[0], loc=(all.find(e=>e.location)||{}).location;
    const sug=[
      ['Tunjuk semua yang berstatus','ONGOING','status:"ONGOING"'],
      ['Cari yang perlu','REVISION','status:"REVISION"'],
      ...(ed?[['Semua kerja editor',ed,`editor:"${ed}"`]]:[]),
      ['Dikemaskini dalam','7 hari lepas','hari:7'],
      ['Item yang ada','komen / notes','ada:komen'],
      ...(loc?[['Scene di lokasi',loc,`lokasi:"${loc}"`]]:[['Tunjuk semua yang','DONE','status:"DONE"']]),
    ];
    body.innerHTML=`<div class="sempty"><span class="ico">${ICON_SEARCH}</span><h3>Cari status, editor, kata kunci dan lain-lain</h3><p>Mula menaip atau tekan cadangan di bawah</p><div class="sgrid">${sug.map(([a,b,qq])=>`<button class="sug" data-sq="${esc(qq)}">${esc(a)} <em translate="no">[${esc(b)}]</em></button>`).join('')}</div></div>`;
    return;
  }
  const {t,out}=searchHits(q);
  if(!out.length){ body.innerHTML='<div class="sempty"><h3>Tiada padanan</h3><p>Cuba kata kunci lain.</p></div>'; return; }
  const groups=new Map(); out.slice(0,300).forEach(x=>{ if(!groups.has(x.p.id)) groups.set(x.p.id,{p:x.p,hits:[]}); groups.get(x.p.id).hits.push(x); });
  const words=t.text.filter(w=>w.length>1);
  const hl=s=>{ let h=esc(s); for(const w of words){ const i=h.toLowerCase().indexOf(esc(w)); if(i>=0) h=h.slice(0,i)+'<mark>'+h.slice(i,i+esc(w).length)+'</mark>'+h.slice(i+esc(w).length); } return h; };
  body.innerHTML=`<div class="sres"><div class="scount">${out.length} hasil</div>`+[...groups.values()].map(({p,hits})=>`<div class="sgrp"><div class="sgh"><span class="pav" style="${gradVars(p.name)}" translate="no">${esc(initials(p.name))}</span><b translate="no">${esc(p.name)}</b><span>${hits.length} hasil</span></div>${hits.slice(0,60).map(({e})=>{
      const V=entV(p,e), k=((V?VSTATUSES:STATUSES).find(s=>s.v===e.status)||{c:'idle'}).c;
      const meta=V?[e.location,e.duration,e.notes,e.feedback]:[e.date?fmtDate(e.date):'', e.room?('Bilik '+e.room):'', normEd(e.editor), e.notes];
      return `<button class="shit" data-goto="${esc(p.id)}" data-eid="${esc(e.id)}"><b translate="no">${hl(entTitle(p,e))}</b><span class="pill s-${e.status==='BELUM MULA'?'todo':k}">${esc(e.status||'')}</span><span class="m" translate="no">${hl(meta.filter(Boolean).join(' · '))}</span></button>`; }).join('')}</div>`).join('')+'</div>';
}

async function waitClaude(){ for(let i=0;i<30;i++){ if(window.claude?.use) return true; await new Promise(r=>setTimeout(r,100)); } return false; }
let booted=false;
async function boot(){
  if(!(await waitClaude())) return snapMode();
  db = await window.claude.use('db');
  if(!db) return snapMode();
  window.claude.use('user').then(async u=>{
    let a=false; try{ a = !!(u && await u.canEdit()); }catch{}
    isAdmin=a; mode = clientPid ? 'view' : (store.get('je.mode')==='view' ? 'view' : 'edit'); applyMode();
    try{ if(u){ me=await u.me(); amOwner=!!me?.isOwner; renderUser(); } }catch{}
    maybeMigrate();
  });
  window.claude.use('downloads').then(d=>{ dl=d; $('btnExport').hidden=!d; $('btnReport').hidden=!d; $('btnDl').hidden=!d; });
  db.collection('projects').onSnapshot(snap=>{
    projects = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    const first=!booted; booted=true;
    if(!projects.find(p=>p.id===curPid)){
      const saved=clientPid||store.get('je.pid');
      const act=active();
      selectProject(projects.find(p=>p.id===saved)?.id || act[act.length-1]?.id || projects[projects.length-1]?.id || null);
    } else renderHeader();
    if(first) setView(clientPid ? 'project' : 'home');
    if(first) maybeMigrate();
    allAt=0; loadAll();
    openArchive.redraw?.();
    renderSched();
  }, err=>fail(err));
  const subEv=()=>db.collection('events').onSnapshot(s=>{ evErr=false; events=s.docs.map(d=>({id:d.id,...d.data()})); renderSched(); if(view==='home') renderHStats(); }, ()=>{ evErr=true; renderSched(); setTimeout(subEv, 10000); });
  const subCrew=()=>db.collection('crew').onSnapshot(s=>{ crew={}; s.docs.forEach(d=>{ const x=d.data(); if(x&&x.name) crew[nkey(x.name)]={id:d.id,...x}; }); renderSched(); }, ()=>{ setTimeout(subCrew, 10000); });
  subEv(); subCrew();
}
let migOffered=false;
function maybeMigrate(){
  if(migOffered || !booted || !isAdmin || !window.ESC?.fs || projects.length || !SNAP?.projects?.length) return;
  migOffered=true;
  const nP=SNAP.projects.length, nE=Object.values(SNAP.entries||{}).reduce((n,l)=>n+l.length,0);
  openModal('Pindahkan data ke Firebase', `
    <p style="margin:0">Pangkalan data Firebase masih kosong. Fail ini membawa data dari versi claude.ai: <strong>${nP} projek</strong> dan <strong>${nE} baris</strong>.</p>
    <p style="margin:0">Tekan <strong>Pindahkan</strong> untuk salin semuanya ke Firebase. Ini dibuat sekali sahaja.</p>
    <div class="hint" id="migMsg"></div><div class="err" id="migErr"></div>`,
    `<button class="btn ghost" data-act="close">Nanti</button><button class="btn primary" id="migGo">Pindahkan</button>`);
  $('migGo').onclick=async()=>{
    const b=$('migGo'); b.disabled=true;
    try{
      const fs=window.ESC.fs, writes=[];
      for(const p of SNAP.projects){ const {id,...d}=p; writes.push([fs.doc('projects/'+id), d]);
        for(const e of (SNAP.entries[id]||[])){ const {id:eid,...x}=e; if(!x.createdAt) x.createdAt=x.updatedAt||Date.now(); writes.push([fs.doc(`projects/${id}/entries/${eid}`), x]); } }
      for(let i=0;i<writes.length;i+=400){ const batch=fs.batch(); writes.slice(i,i+400).forEach(([ref,d])=>batch.set(ref,d)); await batch.commit(); $('migMsg').textContent=`${Math.min(i+400,writes.length)}/${writes.length}…`; }
      closeModal(); toast('Data dipindahkan ke Firebase');
    }catch(err){ b.disabled=false; $('migErr').textContent='Gagal ('+(err?.code||err?.message||'ralat')+'). Pastikan peraturan Firestore sudah ditampal.'; }
  };
}

function countTo(el, to, suffix){
  if(!el) return; suffix=suffix||''; to=+to||0;
  const from = el._v==null ? 0 : el._v; el._v=to;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || from===to){ el.textContent = to.toLocaleString('en-US')+suffix; return; }
  const t0=performance.now(), dur=900; cancelAnimationFrame(el._raf);
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=Math.round(from+(to-from)*e).toLocaleString('en-US')+suffix; if(k<1) el._raf=requestAnimationFrame(step); };
  el._raf=requestAnimationFrame(step);
}

  return `<span class="pcteam" title="Team">`+TEAM_ROLES.map(r=>{ const n=t.filter(m=>m.role===r[0]).length; return n?`<i style="--rc:${r[3]}" title="${n} ${r[1]}">${n}${r[2]}</i>`:''; }).join('')+`</span>`;
}
function openProject(isNew, preset, onCreated){
  const p=isNew?{name:'',master:'',type:'photo',...(preset||{})}:cur();
  let type=p.type||'photo';
  const canType = isNew || !entriesAll.length;
  openModal(isNew?'Projek Baru':'Tetapan projek', `
    <div class="f"><label>Jenis projek</label>
      ${canType?`<div class="seg" id="pType" role="group" aria-label="Jenis projek" style="align-self:flex-start"><button type="button" data-type="photo" aria-pressed="${type==='photo'}">Photo</button><button type="button" data-type="video" aria-pressed="${type==='video'}">Video</button><button type="button" data-type="both" aria-pressed="${type==='both'}">Photo &amp; Video</button></div>
      <span class="hint" id="pTypeHint"></span>`:`<span class="typetag">${type==='both'?'PHOTO &amp; VIDEO':type==='video'?'VIDEO':'PHOTO'}</span>`}</div>
    <div class="grid3" style="grid-template-columns:minmax(0,1fr) 110px">
      <div class="f"><label for="pName">Nama projek</label><input id="pName" value="${esc(p.name||'')}"></div>
      <div class="f"><label for="pYear">Tahun</label><input id="pYear" inputmode="numeric" value="${isNew?new Date().getFullYear():(p.year||guessYear(p, entries))}"></div>
    </div>
    <div class="grid2" id="pVideoF">
      <div class="f"><label for="pLabel">Tarikh / label</label><input id="pLabel" value="${esc(p.label||'')}" placeholder="Cth: 20 SEPT"></div>
      <div class="f"><label for="pCancel">Status projek</label><select id="pCancel"><option value="">Aktif</option><option value="1" ${p.cancelled?'selected':''}>CANCEL</option></select></div>
    </div>
    <div class="f"><label for="pMaster">Link master folder</label><input id="pMaster" type="url" value="${esc(p.master||'')}" placeholder="https://drive.google.com/drive/folders/…"><span class="hint" id="pMasterHint"></span></div>
    <div class="f"><label>Team</label><div class="team-list" id="pTeam"></div>
      <button type="button" class="btn sm team-add" id="pTeamAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Tambah ahli</button>
      <span class="hint">Pilih peranan setiap orang. Bilangan ikut keperluan client.</span></div>
    <div class="err" id="pErr"></div>`,
    `${isNew?'':`<div class="left"><button class="btn danger" id="pDel">Padam projek</button><button class="btn" id="pArc">${p.archived?'Pulihkan dari arkib':'Arkibkan'}</button></div>`}<button class="btn ghost" data-act="close">Batal</button><button class="btn primary" id="pSave">${isNew?'Cipta projek':'Simpan'}</button>`);
  let team=(Array.isArray(p.team)?p.team:[]).map(m=>({role:roleOf(m.role)[0], name:String(m.name||'')}));
  const drawTeam=()=>{
    $('pTeam').innerHTML = team.length ? team.map((m,i)=>`<div class="team-row"><select data-ti="${i}" data-tf="role" aria-label="Peranan">${TEAM_ROLES.map(r=>`<option value="${r[0]}" ${m.role===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select><input data-ti="${i}" data-tf="name" value="${esc(m.name)}" placeholder="Nama ahli" aria-label="Nama ahli" translate="no"><button type="button" class="btn ghost" data-tdel="${i}" title="Buang" aria-label="Buang">✕</button></div>`).join('') : '<div class="team-empty">Belum ada ahli team.</div>';
  };
  drawTeam();
  $('pTeam').addEventListener('input',e=>{ const f=e.target.closest('[data-ti]'); if(f) team[+f.dataset.ti][f.dataset.tf]=f.value; });
  $('pTeam').addEventListener('change',e=>{ const f=e.target.closest('[data-ti]'); if(f) team[+f.dataset.ti][f.dataset.tf]=f.value; });
  $('pTeam').onclick=e=>{ const b=e.target.closest('[data-tdel]'); if(b){ team.splice(+b.dataset.tdel,1); drawTeam(); } };
  $('pTeamAdd').onclick=()=>{ const last=team[team.length-1]; team.push({role: last?last.role:(type==='video'?'video':'photo'), name:''}); drawTeam(); const ins=$('pTeam').querySelectorAll('input'); ins[ins.length-1]?.focus(); };
  const teamVal=()=>team.map(m=>({role:m.role, name:m.name.trim()})).filter(m=>m.name);
  const yearVal=()=>{ const y=parseInt($('pYear').value,10); return y>1990&&y<2200 ? y : new Date().getFullYear(); };
  if(!isNew) $('pArc').onclick=async()=>{
    $('pArc').disabled=true;
    try{
      if(p.archived){ await restoreProject(p.id); }
      else { await archiveProject(p.id, yearVal()); }
      closeModal();
    }catch(err){ $('pArc').disabled=false; $('pErr').textContent=writeErr(err); }
  };
  const syncType=()=>{
    $('pVideoF').hidden = type==='photo';
    $('pName').placeholder = type==='video' ? 'Cth: HAMZAH & MIMI' : type==='both' ? 'Cth: MAJLIS PERKAHWINAN ALI & SITI' : 'Cth: KONVOKESYEN 2026';
    $('pMasterHint').textContent = type==='video' ? 'Pilihan.' : '';
    if($('pType')){
      $('pType').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.type===type)));
      $('pTypeHint').textContent = (!isNew?'Jenis boleh ditukar kerana projek ini belum ada data. ':'') + (type==='both' ? 'Satu senarai acara. Setiap baris ada link output photo dan link output video.' : type==='video' ? 'Senarai episod: item, status, ammend, location folder, script page, notes dan production feedback.' : 'Senarai nama fail ikut hari penggambaran: bilik, status, link footage dan link output.');
    }
  };
  if($('pType')) $('pType').onclick=e=>{ const b=e.target.closest('[data-type]'); if(b){ type=b.dataset.type; syncType(); } };
  syncType();
  $('pSave').onclick=async()=>{
    const name=$('pName').value.trim(); if(!name){ $('pErr').textContent='Beri nama projek.'; return; }
    const extra = type!=='photo' ? {label:$('pLabel').value.trim().toUpperCase(), cancelled:$('pCancel').value==='1'} : {};
    $('pSave').disabled=true;
    try{
      if(isNew){ const ref=db.collection('projects').doc(); await ref.set({name, master:normLink($('pMaster').value), type, year:yearVal(), team:teamVal(), ...extra, ...(preset?.event?{event:preset.event}:{}), createdAt:Date.now()}); if(onCreated) await onCreated(ref.id); selectProject(ref.id); }
      else await db.collection('projects').doc(curPid).update({name, master:normLink($('pMaster').value), year:yearVal(), team:teamVal(), ...(canType?{type}:{}), ...extra});
      closeModal(); if(isNew) setView('project'); toast(isNew?'Projek dicipta':'Projek disimpan');
    }catch(err){ $('pSave').disabled=false; $('pErr').textContent=writeErr(err); }
  };
  if(!isNew) $('pDel').onclick=async()=>{
    const b=$('pDel');
    if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent=`Padam ${entriesAll.length} ${isBoth(p)?'baris':isVid()?'episod':'fail'} & projek? Tekan lagi`; b.classList.add('solid'); return; }
    b.disabled=true; const pid=curPid, col=db.collection(`projects/${pid}/entries`), ids=entriesAll.map(e=>e.id);
    try{
      for(let i=0;i<ids.length;i++){ b.textContent=`Memadam ${i+1}/${ids.length}…`; await col.doc(ids[i]).delete(); }
      await db.collection('projects').doc(pid).delete();
      closeModal(); toast('Projek dipadam');
    }catch(err){ $('pErr').textContent=writeErr(err); b.disabled=false; }
  };
}

/* ---------- video: list ---------- */
function vTags(e){
  const t=[];
  if(e.stage==='OFFLINE') t.push('<span class="tag t-off">OFFLINE</span>');
  if(e.stage==='ONLINE') t.push('<span class="tag t-on">ONLINE</span>');
  if(e.pp) t.push('<span class="tag t-pp">PRODUCT PLACEMENT</span>');
  return t.length?`<span class="tags">${t.join('')}</span>`:'';
}
function renderVideo(){
  if(!entriesLoaded){ $('days').innerHTML='<div class="empty"><h3>Memuatkan episod…</h3></div>'; return; }
  const p=cur(), all=sorted(), q=filt.q.trim().toLowerCase();
  if(!entries.length){
    $('days').innerHTML=`${p.cancelled?'<div class="cancelbar">PROJEK INI CANCEL</div>':''}<div class="empty"><h3>Belum ada episod</h3><p>Tambah episod (contoh: <span class="mono">1-10</span> untuk EPS1 hingga EPS10) atau upload sheet tracker video anda. Setiap tab dalam sheet dibaca sebagai satu projek.</p>${canWrite?'<div class="proj"><button class="btn primary" data-act="add">Tambah episod</button><button class="btn" data-act="import">Upload sheet (Excel / PDF)</button></div>':''}</div>`;
    return;
  }
  const list=all.filter(e=>(filt.status==='ALL'||e.status===filt.status)&&(!q||[e.item,e.scene,e.notes,e.feedback,e.location,e.status,e.sceneStatus,e.duration].some(v=>String(v||'').toLowerCase().includes(q))));
  if(!list.length){ $('days').innerHTML='<div class="empty"><h3>Tiada padanan</h3><p>Tiada episod yang sepadan dengan carian atau tapisan ini.</p><button class="btn" data-act="clearfilt">Kosongkan tapisan</button></div>'; return; }
  if(hasScenes(entries)) return renderScenes(p, list);
  const ro=canWrite?'':' ro', done=entries.filter(e=>e.status==='DONE').length;
  const allSel=list.every(e=>selected.has(e.id));
  let html = p.cancelled ? '<div class="cancelbar">PROJEK INI CANCEL</div>' : '';
  html+=`<section class="track${list.some(e=>e.date)?' evtrack':''}"><div class="track-h">
    <span class="daytag">${p.label?esc(p.label):'VIDEO'}</span>
    <h2 translate="no">${esc(p.name)}</h2><span class="meta">${entries.length} episod</span>
    <span class="mini"><span class="mono">${done}/${entries.length} done</span><span class="bar"><i class="ok" style="width:${entries.length?done/entries.length*100:0}%"></i></span>
    ${canWrite?'<button class="btn addhere" data-act="add">+ Tambah</button>':''}</span>
  </div>
  <div class="vrow head${ro}"><span class="chk">${canWrite?`<input type="checkbox" data-selall="" ${allSel?'checked':''} aria-label="Pilih semua episod">`:''}</span><span>Item</span><span>Status</span><span>Ammend</span><span>Location folder</span><span>Script page</span><span>Notes &amp; feedback</span><span></span></div>`;
  for(const e of list){
    const notes = `${vTags(e)}${e.notes?`<span translate="no">${esc(e.notes)}</span>`:''}${e.feedback?`<small class="fb"><b>Production feedback:</b> <span translate="no">${esc(e.feedback)}</span></small>`:''}`;
    html+=`<div class="vrow${e.pp?' is-pp':''}${selected.has(e.id)?' sel':''}${ro}" data-id="${esc(e.id)}">
      <span class="chk">${canWrite?`<input type="checkbox" data-sel="${esc(e.id)}" ${selected.has(e.id)?'checked':''} aria-label="Pilih ${esc(e.item)}">`:''}</span>
      <span class="vitem" translate="no">${esc(e.item)}</span>
      <span class="st">${statusView(e)}</span>
      <span class="vam" translate="no">${esc(e.ammend||'—')}</span>
      <span class="vloc" translate="no">${esc(e.location||'—')}</span>
      <span class="vpg" translate="no">${esc(e.page||'—')}</span>
      <span class="vnotes">${notes}</span>
      <span class="ed">${canWrite?`<button class="iconbtn" data-edit="${esc(e.id)}" aria-label="Edit ${esc(e.item)}">${ICON_EDIT}</button>`:''}</span>
      <span class="vmeta">${statusView(e)}<span class="tag2">${[e.location, e.page?'m/s '+e.page:'', e.ammend?'ammend '+e.ammend:''].filter(Boolean).map(esc).join(' · ')}</span></span>
    </div>`;
  }
  html+='</section>';
  $('days').innerHTML=html;
}

function renderScenes(p, list){
  const ro=canWrite?'':' ro';
  const groups=new Map(); list.forEach(e=>{ const k=itemKey(e.item); if(!groups.has(k)) groups.set(k,{item:e.item, rows:[]}); groups.get(k).rows.push(e); });
  let html = p.cancelled ? '<div class="cancelbar">PROJEK INI CANCEL</div>' : '';
  for(const [k,g] of groups){
    const ep=entries.filter(e=>itemKey(e.item)===k), n=ep.length, c={ok:0,sent:0,run:0,rev:0,idle:0};
    ep.forEach(e=>{ const x=sClass(e.status); c[x]=(c[x]||0)+1; });
    const nsc=ep.filter(e=>sceneKey(e.scene)).length, allSel=g.rows.every(r=>selected.has(r.id));
    html+=`<section class="track"><div class="track-h">
      <span class="daytag" translate="no">${esc(g.item)}</span><span class="meta">${nsc} scene</span>
      <span class="mini"><span class="mono">${c.ok}/${n} done</span><span class="bar">${['ok','sent','run','rev'].map(x=>`<i class="${x}" style="width:${n?(c[x]||0)/n*100:0}%"></i>`).join('')}</span>
      ${canWrite?`<button class="btn addhere" data-act="addscene" data-item="${esc(g.item)}">+ Scene</button>`:''}</span>
    </div>
    <div class="srow head${ro}"><span class="chk">${canWrite?`<input type="checkbox" data-selall="ep:${esc(k)}" ${allSel?'checked':''} aria-label="Pilih semua scene ${esc(g.item)}">`:''}</span><span>Scene</span><span>Status</span><span>Duration</span><span>Ammend</span><span>Location folder</span><span>Status scene</span><span>Script page</span><span>Notes &amp; feedback</span><span></span></div>`;
    for(const e of g.rows){
      const notes = `${vTags(e)}${e.notes?`<span translate="no">${esc(e.notes)}</span>`:''}${e.feedback?`<small class="fb"><b>Production feedback:</b> <span translate="no">${esc(e.feedback)}</span></small>`:''}`;
      const lbl=`${e.item} ${e.scene||''}`.trim();
      html+=`<div class="srow${e.pp?' is-pp':''}${selected.has(e.id)?' sel':''}${ro}" data-id="${esc(e.id)}">
        <span class="chk">${canWrite?`<input type="checkbox" data-sel="${esc(e.id)}" ${selected.has(e.id)?'checked':''} aria-label="Pilih ${esc(lbl)}">`:''}</span>
        <span class="vitem" translate="no">${esc(e.scene||'—')}</span>
        <span class="st">${statusView(e)}</span>
        <span class="vdur${e.duration?'':' none'}" translate="no">${esc(e.duration||'—')}</span>
        <span class="vam" translate="no">${esc(e.ammend||'—')}</span>
        <span class="vloc" translate="no">${esc(e.location||'—')}</span>
        <span class="vss" translate="no">${esc(e.sceneStatus||'—')}</span>
        <span class="vpg" translate="no">${esc(e.page||'—')}</span>
        <span class="vnotes">${notes}</span>
        <span class="ed">${canWrite?`<button class="iconbtn" data-edit="${esc(e.id)}" aria-label="Edit ${esc(lbl)}">${ICON_EDIT}</button>`:''}</span>
        <span class="vmeta">${statusView(e)}<span class="tag2" translate="no">${[e.location, e.duration, e.page?'m/s '+e.page:'', e.ammend?'ammend '+e.ammend:'', e.sceneStatus].filter(Boolean).map(esc).join(' · ')}</span></span>
      </div>`;
    }
    html+='</section>';
  }
  $('days').innerHTML=html;
}

/* ---------- video: add / edit ---------- */
function openAddVideo(prefItem){
  const splitScenes=t=>String(t||'').split(/[,;\n]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);
  openModal(prefItem?'Tambah scene':'Tambah episod', `
    <div class="f"><label for="vItems">Episod</label>
      <textarea id="vItems" placeholder="EPS1&#10;EPS2&#10;atau julat: 1-10" style="${prefItem?'min-height:44px':''}">${prefItem?esc(prefItem):''}</textarea>
      <span class="hint">Satu episod satu baris. Julat <span class="mono">1-10</span> atau <span class="mono">EPS1-EPS10</span> jadi EPS1 hingga EPS10. Nombor sahaja jadi EPS.</span></div>
    <div class="f"><label for="vScenes">Scene (pilihan)</label><input id="vScenes" placeholder="Cth: 2B, 2D, 9, 34" autocomplete="off"><span class="hint">Asingkan dengan koma. Setiap scene jadi satu baris di bawah episod.</span></div>
    <div class="grid2">
      <div class="f"><label for="vStatus">Status</label><select id="vStatus">${statusOpts('NOT START')}</select></div>
      <div class="f"><label for="vLoc">Location folder</label><input id="vLoc" placeholder="Cth: DAY01, DAY02"></div>
    </div>
    <div class="hint" id="vCount"></div>
    <div class="err" id="aErr"></div>`,
    `<button class="btn ghost" data-act="close">Batal</button><button class="btn primary" id="aSave">Simpan</button>`);
  const locK=x=>vKey(x)+'@'+String(x.location||'').toUpperCase().replace(/\s+/g,'');
  const calc=()=>{
    const its=expandItems($('vItems').value), scs=splitScenes($('vScenes').value), loc=$('vLoc').value.trim(), S=scs.length>0;
    const LK=S&&loc, have=new Set(entries.map(e=>LK?locK(e):vKey(e)));
    const pairs=[]; its.forEach(it=>{ if(S) scs.forEach(sc=>pairs.push({item:it,scene:sc,location:loc})); else pairs.push({item:it,scene:'',location:loc}); });
    const seen=new Set(); const fresh=pairs.filter(x=>{ const k=LK?locK(x):vKey(x); if(have.has(k)||seen.has(k)) return false; seen.add(k); return true; });
    const skip=pairs.length-fresh.length, unit=S?'scene':'episod', lbl=x=>S?`${x.item} / ${x.scene}`:x.item;
    $('vCount').textContent = pairs.length ? `${fresh.length} ${unit} baru${skip?`, ${skip} sudah ada (dilangkau)`:''}: ${fresh.slice(0,12).map(lbl).join(', ')}${fresh.length>12?'…':''}` : '';
    $('aSave').textContent = fresh.length>1?`Simpan ${fresh.length} ${unit}`:'Simpan'; return {fresh, S}; };
  $('vItems').addEventListener('input',calc); $('vScenes').addEventListener('input',calc); $('vLoc').addEventListener('input',calc);
  if(prefItem){ calc(); setTimeout(()=>$('vScenes')?.focus(),30); }
  $('aSave').onclick=async()=>{
    const {fresh:items, S}=calc();
    if(!items.length){ $('aErr').textContent=S?'Masukkan sekurang-kurangnya satu scene baru.':'Masukkan sekurang-kurangnya satu episod baru.'; return; }
    $('aSave').disabled=true;
    let order=entries.reduce((m,e)=>Math.max(m,e.order||0),0);
    const bare=new Map(); entries.forEach(e=>{ if(!sceneKey(e.scene) && !bare.has(itemKey(e.item))) bare.set(itemKey(e.item),e); });
    try{
      for(let i=0;i<items.length;i++){
        const x=items[i];
        $('aSave').textContent=`Menyimpan ${i+1}/${items.length}…`;
        const b=x.scene && bare.get(itemKey(x.item));
        if(b){ bare.delete(itemKey(x.item)); await entriesCol().doc(b.id).update({scene:x.scene, status:$('vStatus').value, ...(x.location?{location:x.location}:{}), updatedAt:Date.now()}); continue; }
        await entriesCol().doc().set({item:x.item, scene:x.scene, status:$('vStatus').value, duration:'', sceneStatus:'', ammend:'', location:x.location, page:'', notes:'', feedback:'', stage:'', pp:false, order:++order, createdAt:Date.now(), updatedAt:Date.now()});
      }
      const unit=S?'scene':'episod';
      closeModal(); toast(items.length>1?`${items.length} ${unit} ditambah`:(S?'Scene ditambah':'Episod ditambah'));
    }catch(err){ $('aSave').disabled=false; calc(); $('aErr').textContent=writeErr(err); }
  };
}

function planVideo(rows, existing, authoritative){
  const ex=sortVideo(existing), exK=occKeys(ex), byKey=new Map(); ex.forEach((e,i)=>byKey.set(exK[i],e));
  const bare=new Map(); ex.forEach(e=>{ if(!sceneKey(e.scene) && !bare.has(itemKey(e.item))) bare.set(itemKey(e.item),e); });
  const inK=occKeys(rows), used=new Set();
  const adds=[], updates=[]; let same=0;
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    let m=byKey.get(inK[i]);
    if(m && used.has(m.id)) m=null;
    if(!m && sceneKey(r.scene)){ const b=bare.get(itemKey(r.item)); if(b && !used.has(b.id) && !rows.some(x=>!sceneKey(x.scene)&&itemKey(x.item)===itemKey(r.item))) m=b; }
    if(!m){ adds.push(r); continue; }
    used.add(m.id);
    const patch={};
    for(const f of ['scene','duration','sceneStatus','status','ammend','location','page','notes','feedback']){ if(r[f]!==''&&r[f]!=null&&String(r[f])!==String(m[f]??'')) patch[f]=r[f]; }
    if(authoritative){ if((r.stage||'')!==(m.stage||'')) patch.stage=r.stage||''; if(!!r.pp!==!!m.pp) patch.pp=!!r.pp; }
    else { if(r.stage && r.stage!==m.stage) patch.stage=r.stage; if(r.pp && !m.pp) patch.pp=true; }
    if(Object.keys(patch).length) updates.push({id:m.id, item:m.item, patch, old:m}); else same++;
  }
  return {adds, updates, same};
}

function serialToISO(n){ const d=new Date(Math.round((n-25569)*864e5)); return d.toISOString().slice(0,10); }
function toISO(cell){
  if(!cell) return null;
  if(cell.t==='n') return serialToISO(cell.v);
  if(cell.t==='d' && cell.v instanceof Date){ const d=cell.v; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  return parseDateText(cell.v);
}
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:'array'});
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn]; if(!ws['!ref']) continue;
    const R=XLSX.utils.decode_range(ws['!ref']);
    const cell=(r,c)=>ws[XLSX.utils.encode_cell({r,c})];
    const txt=(r,c)=>{ const x=cell(r,c); return x&&x.v!=null?String(x.v).trim():''; };
    let hr=-1, cols={}, title='', master='';
    for(let r=R.s.r;r<=Math.min(R.e.r,R.s.r+40)&&hr<0;r++){
      const row=[]; for(let c=R.s.c;c<=R.e.c;c++) row.push([c,txt(r,c).toUpperCase()]);
      const isMaster=row.some(([,v])=>v.includes('MASTER'));
      if(isMaster){ for(let c=R.s.c;c<=R.e.c;c++){ const x=cell(r,c); const u=x?.l?.Target||(/^https?:/i.test(txt(r,c))?txt(r,c):''); if(u){master=u;break;} } continue; }
      if(row.some(([,v])=>v==='FILE NAME'||v==='NAMA FAIL'||v==='NAMA'||v==='FILENAME')){
        hr=r;
        for(const [c,v] of row){
          if(!v) continue;
          if(v==='NO'||v==='BIL') cols.no=c;
          else if(v.includes('DATE')||v.includes('TARIKH')) cols.date=c;
          else if(v.includes('FILE')||v.includes('NAMA')) cols.name=c;
          else if(v.includes('ROOM')||v.includes('BILIK')) cols.room=c;
          else if(v.includes('STATUS')) cols.status=c;
          else if(v.includes('FOOTAGE')) cols.footage=c;
          else if(v.includes('OUTPUT')) cols.output=c;
          else if(v==='EDITOR'||v==='EDITOR NAME') cols.editor=c;
          else if(v.includes('NOTE')||v.includes('CATATAN')) cols.notes=c;
        }
      } else if(!title){ const t=row.find(([,v])=>v&&!/^https?:/i.test(v)); if(t) title=txt(r,t[0]); }
    }
    if(hr<0||cols.name==null) continue;
    const out=[]; let carry=null;
    for(let r=hr+1;r<=R.e.r;r++){
      const name=txt(r,cols.name);
      if(cols.date!=null){ const d=toISO(cell(r,cols.date)); if(d) carry=d; }
      if(!name) continue;
      const link=c=>{ if(c==null) return ''; const x=cell(r,c); return normLink(x?.l?.Target||txt(r,c)); };
      let st=cols.status!=null?txt(r,cols.status).toUpperCase():'';
      if(st==='ONGOING') st='ON GOING';
      if(!STATUSES.find(s=>s.v===st)) st = st ? st : 'BELUM MULA';
      out.push({name, date:carry||'', room:cols.room!=null?txt(r,cols.room):'', status:st, footage:link(cols.footage), output:link(cols.output), notes:cols.notes!=null?txt(r,cols.notes):'', editor:cols.editor!=null?normEd(txt(r,cols.editor)):'', order:out.length+1});
    }
    return {title:title||sn, master, rows:out, sheet:sn};
  }
  return null;
}
const MONTHS={jan:1,feb:2,mar:3,mac:3,apr:4,may:5,mei:5,jun:6,jul:7,aug:8,ogo:8,sep:9,sept:9,oct:10,okt:10,nov:11,dec:12,dis:12};
function parseDateText(s){
  s=String(s||'').trim(); let m;
  if((m=s.match(/^(\d{1,2})[\s\-\/.]+([A-Za-z]{3,9})[\s\-\/.,]+(\d{2,4})$/))){
    const mo=MONTHS[m[2].toLowerCase().slice(0,m[2].toLowerCase().startsWith('sept')?4:3)]||MONTHS[m[2].toLowerCase().slice(0,3)];
    if(!mo) return null; const y=m[3].length===2?'20'+m[3]:m[3];
    return `${y}-${String(mo).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
let pdfReady=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfReady) return pdfReady;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const add=src=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  pdfReady=add(base+'pdf.min.js').then(()=>add(base+'pdf.worker.min.js')).then(()=>{
    const L=window.pdfjsLib; L.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'; return L;
  }).catch(e=>{ pdfReady=null; throw e; });
  return pdfReady;
}
const HEAD_KEYS=[['editor',/^EDITOR$/],['no',/^(NO\.?|BIL\.?)$/],['date',/^(DATE|TARIKH)$/],['name',/FILE\s*NAME|^FILE$|^NAME$|NAMA/],['day',/^(DAY|HARI)$/],['room',/^(ROOM|BILIK)$/],['status',/^STATUS$/],['footage',/FOOTAGE/],['output',/OUTPUT/],['notes',/CATATAN|NOTES?/]];
const HEAD_FILL=/^(LINK|FILE|NAME)$/;
const STATUS_WORDS=['SUBMIT','ON GOING','ONGOING','REVISION','BELUM MULA','ON','GOING','BELUM','MULA'];
async function parsePdf(buf, lib){
  lib = lib || await loadPdfJs();
  const pdf = await lib.getDocument({data:new Uint8Array(buf), isEvalSupported:false}).promise;
  const pages=[];
  for(let pn=1; pn<=pdf.numPages; pn++){
    const page=await pdf.getPage(pn);
    const tc=await page.getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()&&i.transform[4]>=-1).map(i=>({s:i.str.trim(), x:i.transform[4], y:i.transform[5], w:i.width, cx:i.transform[4]+i.width/2, fs:Math.abs(i.transform[3])||10}));
    let anns=[]; try{ anns=(await page.getAnnotations()).filter(a=>a.subtype==='Link'&&a.url).map(a=>({url:a.url, cx:(a.rect[0]+a.rect[2])/2, cy:(a.rect[1]+a.rect[3])/2})); }catch{}
    pages.push({items, anns});
  }
  const groupLines=items=>{
    const ls=[]; for(const it of items.slice().sort((a,b)=>b.y-a.y||a.x-b.x)){ const l=ls.find(l=>Math.abs(l.y-it.y)<=2.5); if(l) l.items.push(it); else ls.push({y:it.y, items:[it]}); }
    ls.forEach(l=>l.items.sort((a,b)=>a.x-b.x)); return ls;
  };
  const headerOf=lines=>{
    for(const l of lines){
      const ups=l.items.map(i=>i.s.toUpperCase().replace(/\s+/g,' '));
      let hits=0; const ok=ups.every(u=>{ const k=HEAD_KEYS.find(([,re])=>re.test(u)); if(k){hits++;return true;} return HEAD_FILL.test(u); });
      if(ok && hits>=1){
        const cols={}, acc={};
        l.items.forEach((it,i)=>{ const k=HEAD_KEYS.find(([,re])=>re.test(ups[i])); if(k){ (acc[k[0]]=acc[k[0]]||[]).push(it); } else if(/^(FILE|NAME)$/.test(ups[i])) (acc.name=acc.name||[]).push(it); });
        for(const k in acc){ const xs=acc[k]; const x0=Math.min(...xs.map(i=>i.x)), x1=Math.max(...xs.map(i=>i.x+i.w)); cols[k]=(x0+x1)/2; }
        return {y:l.y, cols};

    }

  };
  // split pages into column sets
  const sets=[]; let curSet=null;
  for(const pg of pages){
    pg.lines=groupLines(pg.items);
    const h=headerOf(pg.lines);
    pg.header=h;
    if(h){
      const sig=Object.keys(h.cols).sort().join(',');
      if(!curSet || curSet.sig!==sig){ curSet={sig, cols:h.cols, pages:[]}; sets.push(curSet); }
    }

  }

  if(!primary) return null;
  const textCols=c=>['name','notes','footage','output','editor'].filter(k=>k in c);
  const nearest=(cx,keys,cols)=>{ let best=null,d=1e9; for(const k of keys){ if(!(k in cols)) continue; const dd=Math.abs(cx-cols[k]); if(dd<d){d=dd;best=k;} } return best; };
  const isUrl=s=>/^(https?:\/\/|www\.)/i.test(s)||(/[\/?=]/.test(s)&&!/\s/.test(s)&&s.length>12);
  const classify=(it,cols)=>{
    const u=it.s.toUpperCase().replace(/\s+/g,' ');
    if(STATUS_WORDS.includes(u) && 'status' in cols && nearest(it.cx,Object.keys(cols),cols)==='status') return 'status';
    if(['SUBMIT','ON GOING','ONGOING','REVISION','BELUM MULA'].includes(u) && 'status' in cols) return 'status';
    if(parseDateText(it.s) && 'date' in cols) return 'date';
    if(/^\d+(\.0+)?$/.test(it.s)){ const k=nearest(it.cx,['no','day','room'],cols); if(k) return k; }
    if(isUrl(it.s)){ const k=nearest(it.cx,['footage','output'],cols); if(k) return k; }
    const all=nearest(it.cx,Object.keys(cols),cols);
    if(['name','notes','footage','output','editor'].includes(all)) return all;
    return nearest(it.cx,textCols(cols),cols)||all;
  };
  let title='', master='', masterY=null;
  // primary rows
  const rows=[]; const anchorsByPage=[];
  primary.pages.forEach((pg,pi)=>{
    const hy=pg.header?pg.header.y:Infinity;
    if(pg.header){
      for(const l of pg.lines.filter(l=>l.y>hy+2)){
        const t=l.items.map(i=>i.s).join(' ');
        if(/MASTER/i.test(t)){ masterY=l.y; const a=pg.anns.find(a=>Math.abs(a.cy-l.y)<10); master=master||(a?a.url:(l.items.find(i=>isUrl(i.s))?.s||'')); }

      }
    }
    const body=pg.items.filter(i=>i.y<hy-2).map(i=>({...i,k:classify(i,primary.cols)}));
    let anchors=body.filter(i=>i.k==='no').map(i=>i.y);
    if(!anchors.length) anchors=groupLines(body.filter(i=>i.k==='name')).map(l=>l.y);
    anchors.sort((a,b)=>b-a);
    const base=rows.length;
    anchors.forEach(y=>rows.push({y, page:pi, f:{}, dates:[]}));
    anchorsByPage[pi]={base, ys:anchors};
    assign(body, pg.anns.filter(a=>a.cy<hy-2), primary.cols, base, anchors);
  });
  function assign(body, anns, cols, base, anchors){
    if(!anchors.length) return;
    const idx=y=>{ let b=0,d=1e9; anchors.forEach((a,i)=>{ const dd=Math.abs(a-y); if(dd<d){d=dd;b=i;} }); return base+b; };
    for(const it of body){
      if(!it.k) continue; const r=rows[idx(it.y)];
      if(it.k==='date'){ r.dates.push(parseDateText(it.s)); continue; }
      (r.f[it.k]=r.f[it.k]||[]).push(it);
    }
    for(const a of anns){
      if(a.cy>anchors[0]+40) continue;
      const k=nearest(a.cx,['footage','output'],cols); if(!k) continue;

    }

  // secondary sets: reuse primary anchors page-by-page

    if(set===primary) continue;
    set.pages.forEach((pg,pi)=>{
      const ap=anchorsByPage[pi]; if(!ap) return;
      const hy=pg.header?pg.header.y:Infinity;
      if(pg.header && !title){
        for(const l of pg.lines.filter(l=>l.y>hy+2)){ const t=l.items.map(i=>i.s).join(' ').replace(/\s+/g,' ').trim(); if(t && !/MASTER/i.test(t) && !isUrl(t) && (masterY==null || Math.abs(l.y-masterY)>4)){ title=t; break; } }
      }
      if(pg.header && masterY!=null && !master){
        const a=pg.anns.find(a=>Math.abs(a.cy-masterY)<10); const l=pg.lines.find(l=>Math.abs(l.y-masterY)<4);
        master=a?a.url:(l?.items.find(i=>isUrl(i.s))?.s||'');
      }
      const body=pg.items.filter(i=>i.y<hy-2).map(i=>({...i,k:classify(i,set.cols)}));
      assign(body, pg.anns.filter(a=>a.cy<hy-2), set.cols, ap.base, ap.ys);

const VSTATUSES = [

  {v:'ONGOING', c:'run'},
  {v:'1ST DRAFT SENT', c:'sent'},
  {v:'OFFLINE SENT', c:'sent'},
  {v:'ONLINE SENT', c:'sent'},
  {v:'OFFLINE DONE', c:'sent'},
  {v:'ONLINE DONE', c:'sent'},
  {v:'REVISION', c:'rev'},
  {v:'DONE', c:'ok'},
  {v:'CANCEL', c:'rev'},

function normVStatus(s){
  let u=String(s??'').toUpperCase().replace(/\s+/g,' ').trim();
  if(!u||u==='-'||u==='NOT STARTED'||u==='BELUM MULA') return 'NOT START';
  if(u==='ON GOING'||u==='ONGOING') return 'ONGOING';
  if(u==='1ST DRAFT'||u==='FIRST DRAFT SENT'||u==='1ST DRAFT SENT') return '1ST DRAFT SENT';
  if(u==='CANCELLED'||u==='CANCELED') return 'CANCEL';
  if(u==='COMPLETE'||u==='COMPLETED'||u==='SIAP') return 'DONE';
  return u;
}
const itemKey = s => String(s||'').toUpperCase().replace(/\s+/g,'');
// timecode HH:MM:SS:FF — pads each part to two digits; digits only (e.g. 00013012) are split into pairs
function normTC(v){
  const t=String(v??'').trim(); if(!t) return '';
  if(/^\d{1,2}([:;.]\d{1,2}){3}$/.test(t)) return t.split(/[:;.]/).map(x=>x.padStart(2,'0')).join(':');
  if(/^\d{1,8}$/.test(t)) return t.padStart(8,'0').match(/../g).join(':');
  return t;
}
const sceneKey = s => String(s??'').toUpperCase().replace(/\s+/g,'').replace(/\.0+$/,'');
const vKey = e => itemKey(e.item)+'|'+sceneKey(e.scene);

const epCount = list => new Set((list||[]).map(e=>itemKey(e.item))).size;

const epNum = s => { const m=String(s||'').match(/(\d+)/); return m?Number(m[1]):Infinity; };
function expandItems(text){
  const out=[];
  for(let line of String(text||'').split('\n')){
    line=line.trim(); if(!line) continue;
    let m;
    if((m=line.match(/^(?:EPS\s*)?(\d+)\s*[-–]\s*(?:EPS\s*)?(\d+)$/i))){
      const a=+m[1], b=+m[2]; if(b>=a && b-a<=200){ for(let i=a;i<=b;i++) out.push('EPS'+i); continue; }
    }
    if(/^\d+$/.test(line)){ out.push('EPS'+line); continue; }
    out.push(line.toUpperCase().replace(/^EPS\s+/,'EPS'));
  }

}
function colorKind(rgb){
  if(!rgb) return '';

function parseVideoWorkbook(buf){
  const wb=XLSX.read(buf,{type:'array',cellStyles:true});

  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn]; if(!ws['!ref']) continue;
    const R=XLSX.utils.decode_range(ws['!ref']);
    const mg={}; (ws['!merges']||[]).forEach(m=>{ for(let r=m.s.r;r<=m.e.r;r++) for(let c=m.s.c;c<=m.e.c;c++) if(r!==m.s.r||c!==m.s.c) mg[r+','+c]=m.s; });

    const dtxt=(r,c)=>{ const x=cell(r,c); if(!x||x.v==null) return ''; if(x.t==='n' && x.w && /:/.test(x.w)) return x.w.trim(); return String(x.v).trim().replace(/\.0+$/,''); };

      const ups=[]; for(let c=R.s.c;c<=R.e.c;c++) ups.push([c,txt(r,c).toUpperCase()]);
      if(ups.some(([,v])=>v==='ITEM') && ups.some(([,v])=>v==='STATUS')){
        hr=r;

          if(!v) continue;
          if(v==='ITEM') cols.item=c;
          else if(v==='STATUS') cols.status=c;
          else if(v.includes('STATUS')&&v.includes('SCENE')) cols.sceneStatus=c;
          else if(/^SCENES?$/.test(v)) cols.scene=c;
          else if(v.includes('DURATION')||v==='DURASI') cols.duration=c;
          else if(/AM+E?ND/.test(v)) cols.ammend=c;
          else if(v.includes('LOCATION')) cols.location=c;
          else if(v.includes('SCRIPT')||v==='PAGE') cols.page=c;

    }

      const t=txt(r,c); if(!t) continue;

        const sc=g('scene').replace(/\.0+$/,'').toUpperCase();
        if(!sc && ![g('status'),g('notes'),g('feedback'),g('ammend'),g('page'),cols.duration!=null?dtxt(r,cols.duration):'',g('sceneStatus')].some(Boolean)){ if(!rows.some(x=>itemKey(x.item)===itemKey(it))) pendingBare.push(it); continue; }

        continue;
      }
      rows.push({item:it, status:normVStatus(g('status')), ammend:g('ammend').replace(/\.0+$/,''), location:g('location'), page:g('page').replace(/\.0+$/,''), notes:g('notes'), feedback:g('feedback'), stage:stage?stage.toUpperCase():'', pp:kinds.includes('pp'), order:rows.length+1});

    let cancelled=false;
    for(let r=endRow;r<=R.e.r;r++) for(let c=R.s.c;c<=R.e.c;c++) if(txt(r,c).toUpperCase()==='CANCEL') cancelled=true;

}

const keyOf=s=>String(s||'').toUpperCase().replace(/\s+/g,' ').trim();
function planImport(rows, existing){
  const byKey=new Map();
  existing.forEach(e=>{ const k=keyOf(e.name); if(!byKey.has(k)) byKey.set(k,[]); byKey.get(k).push(e); });
  const used=new Set(), adds=[], updates=[]; let same=0;
  for(const r of rows){
    const cands=(byKey.get(keyOf(r.name))||[]).filter(e=>!used.has(e.id));
    const m=cands.find(e=>e.date===r.date)||cands[0];
    if(!m){ adds.push(r); continue; }
    used.add(m.id);
    const patch={};
    for(const f of ['date','room','status','footage','output','notes','editor']){ if(r[f]!==''&&r[f]!=null&&String(r[f])!==String(m[f]??'')) patch[f]=r[f]; }
    if(Object.keys(patch).length) updates.push({id:m.id, name:m.name, patch, old:m}); else same++;
  }
  return {adds, updates, same};
}

    put(r,1,i+1,base);
    if(first && e.date){ const [y,m,d]=e.date.split('-').map(Number); put(r,2,Date.UTC(y,m-1,d)/864e5+25569,{...base,numFmt:'d mmm yyyy'},{z:'d mmm yyyy'}); }
    else put(r,2,'',base);
    put(r,3,e.name,{...base,alignment:{horizontal:'left',vertical:'center',wrapText:true}});
    put(r,4,e.date?dm[e.date]:'',base);
    const room=String(e.room||''); const ri=roomList.indexOf(room);

    put(r,6,e.status||'',{...base,font:{name:'Arial',sz:10,bold:true},...(STATUS_FILL[e.status]?{fill:{fgColor:{rgb:STATUS_FILL[e.status]}}}:{})});
    put(r,7,e.footage||'',{...base,...(e.footage?link:{})},e.footage?{l:{Target:e.footage}}:null);
    put(r,8,e.output||'',{...base,...(e.output?link:{})},e.output?{l:{Target:e.output}}:null);
    put(r,9,normEd(e.editor),{...base,font:{name:'Arial',sz:10,bold:true}});
    if(withNotes) put(r,10,e.notes||'',{...base,alignment:{horizontal:'left',vertical:'center',wrapText:true}});
  });
  if(gStart!=null && 5+rows.length-1>gStart) merges.push({s:{r:gStart,c:2},e:{r:5+rows.length-1,c:2}});
  ws['!ref']=X.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(5+rows.length-1,4),c:lastC}});
  ws['!merges']=merges;
  ws['!cols']=[{wch:3},{wch:5},{wch:13},{wch:40},{wch:6},{wch:7},{wch:12},{wch:75},{wch:75},{wch:14},{wch:35}].slice(0,lastC+1);
  if(intoWb){ let nm=String(p.name||'Projek').replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,31)||'Projek'; let k=2; while(intoWb.SheetNames.includes(nm)) nm=nm.slice(0,28)+' '+(k++); X.utils.book_append_sheet(intoWb,ws,nm); return intoWb; }
  const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,'TASK');
  return wb;
}

let pdfLibReady=null;
async function saveFile(filename, data, okMsg){
  if(!dl){ toast('Download tidak tersedia di sini.'); return false; }
  for(let attempt=0; attempt<2; attempt++){
    try{ await dl.save({filename, data}); toast(okMsg); return true; }
    catch(err){
      const c=err?.code||'';
      if(c==='declined') return false;
      if(c==='rate_limited' && attempt===0){ await new Promise(r=>setTimeout(r,1800)); continue; }
      toast(c==='rate_limited' ? 'Tetingkap simpan sebelumnya masih terbuka. Tutup dahulu, kemudian cuba lagi.'
        : (c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed') ? 'Download tidak dibenarkan dalam paparan ini. Buka apps di claude.ai dan cuba lagi.'
        : 'Download gagal ('+(c||'ralat')+'). Cuba lagi.');
      return false;
    }
  }
  return false;
}
function loadJsPdf(){
  if(window.jspdf?.jsPDF?.API?.autoTable) return Promise.resolve(window.jspdf.jsPDF);
  if(pdfLibReady) return pdfLibReady;
  const add=src=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>{ s.remove(); rej(new Error('load '+src)); }; document.head.appendChild(s); });
  const one=(a,b)=>add(a).catch(()=>add(b));
  pdfLibReady=(window.jspdf?.jsPDF ? Promise.resolve() : one('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'))
    .then(()=>one('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'))
    .then(()=>window.jspdf.jsPDF).catch(e=>{ pdfLibReady=null; throw e; });
  return pdfLibReady;
}
const hasComment = (e, video) => video ? !!(String(e.notes||'').trim()||String(e.feedback||'').trim()) : !!String(e.notes||'').trim();
const pdfText = s => String(s??'').replace(/[​-‏⁠﻿]/g,'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g,'').trim();
const RPT_STATUS = {todo:[254,226,226], ok:[228,245,236], run:[255,241,220], rev:[253,235,234], idle:[240,240,241], sent:[233,238,255]};
const RPT_STATUS_INK = {todo:[220,38,38], ok:[18,128,92], run:[180,83,9], rev:[200,50,44], idle:[95,99,104], sent:[47,85,212]};
function buildReport(JsPDF, p, rows, o){
  // o: {video, onlyComments, note, statusOf(status)->class, dayOf(date)->n, fmtDate(date)->text, total, generatedAt}
  const doc=new JsPDF({orientation:'landscape', unit:'pt', format:'a4'});
  const W=doc.internal.pageSize.getWidth(), M=36;
  const now=new Date(o.generatedAt||Date.now());
  const B=LANG==='en'?MON_EN:['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
  const stamp=`${now.getDate()} ${B[now.getMonth()]} ${now.getFullYear()}, ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  let y=M+4;
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(90,98,113);
  doc.setFillColor(10,10,10); doc.roundedRect(M, y-10, 13, 13, 2.5, 2.5, 'F'); doc.setTextColor(255,255,255); doc.setFontSize(9); doc.text('e', M+4, y-0.5);
  doc.setTextColor(10,10,10); doc.setFontSize(10); doc.text('esc', M+19, y); doc.setFont('helvetica','normal'); doc.text('Media', M+19+doc.getTextWidth('esc')+0.3, y);
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(110,110,110); doc.text(tr(`REPORT UNTUK EDITOR  ·  ${o.video?'VIDEO':'PHOTO'}`), W-M, y, {align:'right'});
  doc.setDrawColor(228,228,228); doc.setLineWidth(0.6); doc.line(M, y+8, W-M, y+8); y+=10;
  y+=20; doc.setFontSize(20); doc.setTextColor(20,23,28);
  doc.text(pdfText(p.name)||tr('Projek'), M, y);
  y+=16; doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,98,113);
  const commented=rows.filter(e=>hasComment(e,o.video)).length;
  const bits=[`Dijana ${stamp}`, o.onlyComments?`${rows.length} item ada komen (daripada ${o.total})`:`${rows.length} item, ${commented} ada komen`];
  if(o.video && p.label) bits.push(`Tarikh: ${pdfText(p.label)}`);
  if(o.video && p.cancelled) bits.push('PROJEK CANCEL');
  if(o.statusFilter && o.statusFilter!=='ALL') bits.push(`Status: ${o.statusFilter}`);
  if(o.editorFilter && o.editorFilter!=='ALL') bits.push(o.editorFilter===''?'Editor: (tiada)':`Editor: ${pdfText(o.editorFilter)}`);
  doc.text(bits.map(tr).join('   ·   '), M, y);
  if(p.master){ y+=14; doc.setTextColor(10,10,10); doc.textWithLink(tr('Master folder (klik untuk buka)'), M, y, {url:p.master}); }
  if(o.note && pdfText(o.note)){
    y+=14;
    doc.setFontSize(10); const lines=doc.splitTextToSize(pdfText(o.note), W-2*M-24);
    const h=lines.length*13+26;
    doc.setFillColor(243,243,243); doc.roundedRect(M, y, W-2*M, h, 4, 4, 'F'); doc.setFillColor(10,10,10); doc.rect(M, y, 3, h, 'F');
    doc.setFont('helvetica','bold'); doc.setTextColor(10,10,10); doc.text(tr('NOTA UNTUK EDITOR'), M+12, y+15);
    doc.setFont('helvetica','normal'); doc.setTextColor(20,23,28); doc.text(lines, M+12, y+29);
    y+=h;
  }
  y+=12;
  let head, body, colStyles, statusCol, linkCols={}, commentCols=[];
  if(o.video && hasScenes(rows)){
    head=[['Item','Scene','Status','Penanda','Location folder','Duration','Script page','Notes','Production feedback'].map(tr)];
    body=rows.map(e=>[pdfText(e.item), pdfText(e.scene), tr(pdfText(e.status)), [e.stage||'', e.pp?'PRODUCT PLACEMENT':''].filter(Boolean).join('\n'), pdfText(e.location), pdfText(e.duration), pdfText(e.page), pdfText(e.notes), pdfText(e.feedback)]);
    colStyles={0:{cellWidth:44,fontStyle:'bold'},1:{cellWidth:50,fontStyle:'bold'},2:{cellWidth:76},3:{cellWidth:70,fontSize:7.5},4:{cellWidth:64},5:{cellWidth:60,halign:'center'},6:{cellWidth:40,halign:'center'},7:{cellWidth:'auto'},8:{cellWidth:'auto'}};
    statusCol=2; commentCols=[7,8]; o.markerCol=3;
  } else if(o.video){
    head=[['Item','Status','Penanda','Location folder','Script page','Notes','Production feedback'].map(tr)];
    body=rows.map(e=>[pdfText(e.item), tr(pdfText(e.status)), [e.stage||'', e.pp?'PRODUCT PLACEMENT':''].filter(Boolean).join('\n'), pdfText(e.location), pdfText(e.page), pdfText(e.notes), pdfText(e.feedback)]);
    colStyles={0:{cellWidth:52,fontStyle:'bold'},1:{cellWidth:84},2:{cellWidth:78,fontSize:7.5},3:{cellWidth:96},4:{cellWidth:44,halign:'center'},5:{cellWidth:'auto'},6:{cellWidth:'auto'}};
    statusCol=1; commentCols=[5,6];
  } else {
    head=[['No','Tarikh','Nama fail','Bilik','Status','Editor','Komen / catatan','Footage','Output'].map(tr)];
    body=rows.map(e=>[String(e._no||''), e.date?tr(`Hari ${o.dayOf(e.date)} · ${o.fmtDate(e.date)}`):'-', pdfText(e.name), pdfText(e.room), tr(pdfText(e.status)), pdfText(normEd(e.editor))||'-', pdfText(e.notes), e.footage?tr('Buka'):'-', e.output?tr('Buka'):'-']);
    colStyles={0:{cellWidth:26,halign:'right'},1:{cellWidth:86},2:{cellWidth:140,fontStyle:'bold'},3:{cellWidth:32,halign:'center'},4:{cellWidth:66},5:{cellWidth:62,fontStyle:'bold'},6:{cellWidth:'auto'},7:{cellWidth:44,halign:'center'},8:{cellWidth:44,halign:'center'}};
    statusCol=4; commentCols=[6]; linkCols={7:'footage',8:'output'};
  }
  if(!body.length) body=[[{content:tr(o.onlyComments?'Tiada item yang ada komen dalam projek ini.':'Tiada item.'), colSpan:head[0].length, styles:{halign:'center',textColor:[90,98,113],fontStyle:'italic'}}]];
  doc.autoTable({
    head, body, startY:y, margin:{left:M,right:M,top:M,bottom:M+14},
    theme:'grid',
    styles:{font:'helvetica', fontSize:8.5, cellPadding:5, lineColor:[222,222,222], lineWidth:0.5, textColor:[20,23,28], valign:'top', overflow:'linebreak'},
    headStyles:{fillColor:[10,10,10], textColor:255, fontStyle:'bold', fontSize:8},
    columnStyles:colStyles,
    didParseCell:d=>{
      if(d.section!=='body' || !rows.length) return;
      const e=rows[d.row.index];
      if(d.column.index===statusCol){ const k=o.statusOf(e.status); d.cell.styles.fillColor=RPT_STATUS[k]||RPT_STATUS.idle; d.cell.styles.textColor=RPT_STATUS_INK[k]||RPT_STATUS_INK.idle; d.cell.styles.fontStyle='bold'; }
      if(commentCols.includes(d.column.index) && String(d.cell.raw||'').trim()) d.cell.styles.fillColor=[246,246,246];
      if(linkCols[d.column.index] && e[linkCols[d.column.index]]){ d.cell.styles.textColor=[47,85,212]; d.cell.styles.fontStyle='bold'; }
      if(o.video && d.column.index===(o.markerCol??2)){ if(e.stage==='OFFLINE') d.cell.styles.textColor=[194,65,12]; else if(e.stage==='ONLINE') d.cell.styles.textColor=[18,128,92]; else if(e.pp) d.cell.styles.textColor=[14,116,144]; d.cell.styles.fontStyle='bold'; }
    },
    didDrawCell:d=>{
      if(d.section!=='body' || !rows.length) return;
      const k=linkCols[d.column.index]; const url=k && rows[d.row.index][k];
      if(url) doc.link(d.cell.x, d.cell.y, d.cell.width, d.cell.height, {url});
    },
    didDrawPage:()=>{
      const H=doc.internal.pageSize.getHeight();
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90,98,113);
      doc.text(`escMedia Work Record  ·  ${pdfText(p.name)}  ·  ${stamp}`, M, H-18);
      doc.text(tr(`Halaman ${doc.internal.getNumberOfPages()} / {total}`), W-M, H-18, {align:'right'});
    }
  });
  doc.putTotalPages('{total}');
  return doc;
}

function timeInfo(t){
  const label=String(t||'').trim().replace(/\s*(?:[-–—]|hingga|sampai|to)\s*/i,'–').replace(/\s*(am|pm)\b/gi,(m,x)=>x.toLowerCase());
  const s=String(t||'').toLowerCase().replace(/\s+/g,'').replace(/hingga|sampai|to/,'-').replace(/[–—]/,'-');
  const [a,b]=s.split('-');

function parseSchedule(text){

  const dateNum=new RegExp(`^(?:${DAYRE}\\s*,?\\s*)?(\\d{1,2})\\s*[\\/.-]\\s*(\\d{1,2})(?:\\s*[\\/.-]\\s*(\\d{2,4}))?\\s*[,(-]?\\s*${DAYRE}?\\s*\\)?\\s*:?$`,'i');
  const dateTxt=new RegExp(`^(?:${DAYRE}\\s*,?\\s*)?(\\d{1,2})\\s+([a-z]+)(?:\\s+(\\d{4}))?\\s*[,(-]?\\s*${DAYRE}?\\s*\\)?\\s*:?$`,'i');

  const evRe=new RegExp(`^(${TP}\\s*(?:[-–—]|hingga|sampai|to)\\s*${TP}|${TP})\\s*[:\\-–]\\s*(.+)$`,'i');
  for(const line of lines){
    if(!line) continue;
    let m;
    if((m=line.match(dateNum)) && +m[3]<=12 && +m[3]>=1){
      const d=+m[2], mo=+m[3]; let y=m[4]?+m[4]:guessYearFor(mo); if(y<100) y+=2000;
      date=iso3(y,mo,d); dayGiven=(m[1]||m[5]||'').toLowerCase(); last=null;
      if(dayGiven && DAYN[dayGiven]!==undefined && new Date(y,mo-1,d).getDay()!==DAYN[dayGiven]) warn.push({date, msg:'dayMismatch', day:dayGiven});
      continue;
    }
    if((m=line.match(dateTxt)) && MONN[(m[3]||'').toLowerCase()]){
      const d=+m[2], mo=MONN[m[3].toLowerCase()]; const y=m[4]?+m[4]:guessYearFor(mo);
      date=iso3(y,mo,d); dayGiven=(m[1]||m[5]||'').toLowerCase(); last=null;
      if(dayGiven && DAYN[dayGiven]!==undefined && new Date(y,mo-1,d).getDay()!==DAYN[dayGiven]) warn.push({date, msg:'dayMismatch', day:dayGiven});
      continue;
    }
    if((m=line.match(/^\((.+)\)$/))){

    }

    }

  }
  return {events:out, warn};
}

function shrinkImg(file, max){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k); cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL('image/png')); }; im.src=r.result; }; r.readAsDataURL(file); }); }
